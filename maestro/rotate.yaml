# Turning the phone keeps the chat: same bot, same composer text, no restart.
# (Folding and unfolding the Fold is not scriptable here: use the emulator's
# posture controls, see docs/TESTING.md.) Expects a configured app.
appId: se.royan.pomelu
---
- launchApp
- extendedWaitUntil:
    visible: "Attach"
    timeout: 30000
# Let a cold start settle: taps during first-load work can be lost.
- waitForAnimationToEnd:
    timeout: 15000
# The composer field by its test id (its hint is gone under a draft).
- tapOn:
    id: "composer"
# Start from an empty composer: drafts survive restarts.
- repeat:
    times: 40
    commands:
      - pressKey: Backspace
- inputText: "keep me"
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "keep me"
    timeout: 10000
- takeScreenshot: rotate-landscape
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "keep me"
    timeout: 10000
- takeScreenshot: rotate-portrait
# Leave the composer empty ("keep me" is 7 characters).
- repeat:
    times: 8
    commands:
      - pressKey: Backspace
