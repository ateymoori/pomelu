name: Feature request
description: Suggest a change. Read the scope in CONTRIBUTING.md first.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could Pomelu help? Which screen?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I read the scope in CONTRIBUTING.md, and this fits a client for one Hermes gateway.
          required: true
