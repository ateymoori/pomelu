name: hermes
description: "Pomelu: unofficial mobile app for Hermes Agent. Connects to a Hermes remote gateway."
publish_to: 'none'
# The version code is a counter: +1 per release. It starts above the
# epoch-seconds codes already installed, and stays under Play's 2.1 billion cap.
version: 1.0.1+1792000003

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, routing, models
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.2

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

  # Content rendering
  gpt_markdown: ^1.4.0
  cached_network_image: ^4.0.5
  photo_view: ^0.15.0
  video_player: ^2.14.1
  just_audio: ^0.10.6
  re_highlight: ^0.0.3

  # Attachments in/out
  app_links: ^7.2.2
  file_picker: ^13.2.0
  image_picker: ^1.2.4
  record: ^7.1.2
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  url_launcher: ^6.3.3
  gal: ^2.3.3

  # Location share: OpenStreetMap tiles, the phone's GPS and geocoder
  flutter_map: ^8.3.2
  flutter_map_location_marker: ^10.3.0
  latlong2: ^0.10.1
  geocoding: ^5.0.0
  # Already under flutter_map_location_marker; named for openAppSettings
  # (a refused location or microphone permission).
  geolocator: ^14.1.2

  # Notifications (local only — the gateway is the user's own server, there
  # is no push service); the periodic check for bot messages while away
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10

  # Bot Screen: noVNC (bundled in assets/bot_screen) in a web view
  webview_flutter: ^4.14.1

  # The app icon's menu: a chat per bot
  quick_actions: ^1.1.1

  # Utilities
  intl: ^0.20.3
  mime: ^2.1.0
  uuid: ^4.6.0
  logger: ^2.8.0
  package_info_plus: ^10.2.2
  cupertino_icons: ^2.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3
  geolocator_platform_interface: ^4.4.1
  webview_flutter_platform_interface: ^2.15.1

# Upstream constraints lag the latest releases; each override is checked by
# analyze, tests and both platform builds. Drop it once upstream catches up.
dependency_overrides:
  # Linux only: geolocator_linux pins dbus 0.7, connectivity_plus's nm 0.8.
  dbus: ^0.8.0
  # flutter_map_location_marker 10.3.0 (latest) still asks for latlong2 ^0.9.
  latlong2: ^0.10.1
  # riverpod_generator 4.0.9 still asks for build <5 (build_runner 2.17).
  build: ^5.0.0
  # 1.4.0 with three table fixes: fills clipped to the rounded border, the
  # header style on header cells, and a table that fits its width (cells
  # wrap; it scrolls only when whole words do not fit). None upstream; drop
  # when they are.
  gpt_markdown:
    path: third_party/gpt_markdown

flutter:
  uses-material-design: true
  generate: true
  # Only what the app loads at runtime. The launcher icon and splash images
  # are build-time inputs, read from their paths by the tools below.
  assets:
    - assets/images/pomelu_logo.png
    - assets/characters/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/bot_screen/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/pomelu_icon.png
  # Transparent backdrop: the launcher shows the character alone.
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: assets/images/pomelu_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/images/pomelu_icon_mono.png
  min_sdk_android: 29
  # Apple rejects alpha in the app icon: the light icon gets a white backdrop.
  # Dark is the clear character; tinted is it desaturated.
  image_path_ios_dark_transparent: assets/images/pomelu_icon.png
  image_path_ios_tinted_grayscale: assets/images/pomelu_icon.png
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#FFFFFF"
  remove_alpha_ios: true

# Splash colors equal the theme backdrop (tokens.dart `backdropMid`).
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/images/pomelu_splash.png
  image_dark: assets/images/pomelu_splash.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/images/pomelu_splash_a12.png
    image_dark: assets/images/pomelu_splash_a12.png
  android: true
  ios: true
